# Render blueprint for the LedgerFlow API (https://render.com/docs/blueprint-spec).
# The frontend is deployed separately on Vercel; the database is Neon Postgres.
# The worker runs inside the API process (EMBEDDED_WORKER=true) so the free plan needs only one service.
# PDFs are stored in Postgres (STORAGE_BACKEND=db) because the free instance's disk is wiped on every deploy.
services:
  - type: web
    name: ledgerflow-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false            # paste the Neon *pooled* connection string when Render asks
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_PASSWORD
        value: ledgerflow-demo
      - key: STORAGE_BACKEND
        value: db
      - key: EMBEDDED_WORKER
        value: "true"
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: WORKER_POLL_INTERVAL_S
        value: "2"
      - key: LLM_PROVIDER
        value: none
      - key: COOKIE_SECURE
        value: "true"
